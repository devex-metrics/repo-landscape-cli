name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.5.1
      - name: Require release tag to equal package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag must equal v$version; got $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Require reviewed main ancestry
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag commit must already be reachable from main" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
